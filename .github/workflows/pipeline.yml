# Churn Guard CI/CD pipeline
#
#   1 · Lint & unit tests ──────────┐
#   1 · Workflow lint ──────────────┼──────────────────────────► ✅ All checks ─► 4 · Deploy ─► 5 · Smoke test
#   2 · Train & model-quality gate ─┴─► 3 · Docker build & test ─┘    (main only)  (Render)     (live API)
#                                       (push to GHCR on main)
#
# A model that is worse than production fails the gate, so no image is built
# and production keeps serving the current model.

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12" # must match the Dockerfile base image (the model is trained here)
  IMAGE_NAME: churn-guard

jobs:
  # ─────────────────────────────── Stage 1 ───────────────────────────────
  test:
    name: 1 · Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Unit tests + coverage (min 85%)
        run: pytest --cov --cov-report=term-missing

  workflow-lint:
    name: 1 · Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Lint GitHub Actions workflows (with shellcheck)
        run: |
          pip install actionlint-py
          actionlint -color

  # ─────────────────────────────── Stage 2 ───────────────────────────────
  train:
    name: 2 · Train & model-quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the model report on PRs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .

      - name: Train model
        run: python -m churn.train

      - name: Model-quality gate (vs. thresholds and production baseline)
        id: gate
        run: python -m churn.gate --report gate-report.md

      - name: Post model report on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('gate-report.md') != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- churn-guard-model-report -->";
            const body = `${marker}\n${fs.readFileSync("gate-report.md", "utf8")}\n_Commit \`${context.sha.slice(0, 7)}\`_`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload approved model
        uses: actions/upload-artifact@v7
        with:
          name: model
          path: |
            models/model.joblib
            models/metrics.json
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────── Stage 3 ───────────────────────────────
  docker:
    name: 3 · Docker build & test
    needs: [test, train]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry (main only)
    outputs:
      image: ${{ steps.names.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Download approved model
        uses: actions/download-artifact@v8
        with:
          name: model
          path: models

      - name: Image names
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          repo="ghcr.io/${OWNER,,}/${IMAGE_NAME}"   # registry names must be lowercase
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true # keep it locally so we can test it before pushing
          tags: |
            ${{ steps.names.outputs.image }}
            ${{ steps.names.outputs.repo }}:latest
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test the container (health + prediction)
        env:
          IMAGE: ${{ steps.names.outputs.image }}
        run: |
          docker run -d --name api -e PORT=10000 -p 10000:10000 "$IMAGE"
          for _ in $(seq 1 30); do curl -sf localhost:10000/health >/dev/null && break; sleep 1; done
          health=$(curl -sf localhost:10000/health)
          echo "health: $health"
          echo "$health" | grep -q "\"git_sha\":\"${GITHUB_SHA:0:7}\"" || { echo "::error::container reports the wrong commit"; exit 1; }
          prediction=$(curl -sf -X POST localhost:10000/predict -H 'Content-Type: application/json' \
            -d '{"tenure_months":3,"monthly_charges":95,"support_tickets":4,"logins_last_30d":1,"late_payments":2,"contract":"month-to-month","payment_method":"invoice","plan":"premium"}')
          echo "prediction: $prediction"
          echo "$prediction" | grep -q '"risk":"high"' || { echo "::error::unexpected prediction"; exit 1; }
          echo "## 🐳 Container test passed" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$prediction\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Show container logs on failure
        if: failure()
        run: docker logs api || true

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          REPO: ${{ steps.names.outputs.repo }}
        run: |
          docker push "$IMAGE"
          docker push "$REPO:latest"
          echo "## 📦 Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  # Single required check for branch protection.
  checks-passed:
    name: ✅ All checks passed
    if: always()
    needs: [test, workflow-lint, train, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every upstream job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed ($r) — nothing will be deployed."
              exit 1
            fi
          done

  # ─────────────────────────────── Stage 4 ───────────────────────────────
  deploy:
    name: 4 · Deploy to Render
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [checks-passed, docker]
    runs-on: ubuntu-latest
    environment:
      # Add required reviewers to this environment for a manual approval gate.
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy of this exact image
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.docker.outputs.image }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not set — see docs/SETUP.md"
            exit 1
          fi
          encoded=$(jq -rn --arg v "$IMAGE" '$v|@uri')
          curl -fsS -X POST "${HOOK}&imgURL=${encoded}" > /dev/null
          echo "Render is deploying $IMAGE"
          echo "## 🚀 Deploy triggered on Render" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────── Stage 5 ───────────────────────────────
  smoke-test:
    name: 5 · Smoke test live API
    needs: deploy
    if: vars.PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Wait until production serves this commit, then test a prediction
        env:
          URL: ${{ vars.PRODUCTION_URL }}
        run: |
          short="${GITHUB_SHA:0:7}"
          # Render builds nothing (the image is ready) but still needs time to pull and start it.
          for attempt in $(seq 1 40); do
            health=$(curl -s --max-time 30 "$URL/health" || true)
            if echo "$health" | grep -q "\"git_sha\":\"$short\""; then
              echo "✅ Live after ~$((attempt * 15))s: $health"
              break
            fi
            echo "Attempt $attempt: not serving $short yet (${health:-no response}), retrying in 15s…"
            sleep 15
            if [ "$attempt" -eq 40 ]; then
              echo "::error::$URL did not serve commit $short within 10 minutes"
              exit 1
            fi
          done
          prediction=$(curl -fsS -X POST "$URL/predict" -H 'Content-Type: application/json' \
            -d '{"tenure_months":3,"monthly_charges":95,"support_tickets":4,"logins_last_30d":1,"late_payments":2,"contract":"month-to-month","payment_method":"invoice","plan":"premium"}')
          echo "$prediction" | grep -q '"risk":"high"'
          echo "## ✅ Smoke test passed — $URL is serving commit \`$short\`" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$prediction\`" >> "$GITHUB_STEP_SUMMARY"
