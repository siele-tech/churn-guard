[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-guard"
version = "1.0.0"
description = "Customer churn prediction API with a model-quality gate in CI/CD."
requires-python = ">=3.11"
# Runtime versions are pinned exactly: the model is trained in CI and loaded in the
# Docker image, and scikit-learn models must be loaded with the version that trained them.
dependencies = [
  "scikit-learn==1.9.1",
  "numpy==2.5.3",
  "pandas==3.0.6",
  "joblib==1.6.0",
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-cov>=7", "httpx>=0.28", "ruff>=0.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
churn = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["churn"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
